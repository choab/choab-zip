app-id: io.github.rustzip.SevenRustZip
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# The freedesktop SDK ships Rust as an optional extension
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: 7rust-zip

finish-args:
  # GUI
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # An archiver has to be able to read and write the user's files
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  # Native file dialogs go through the XDG desktop portal
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents

modules:
  - name: 7rust-zip
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/7rust-zip/.cargo
        CARGO_NET_OFFLINE: 'false'
      # cargo needs to fetch the crates.io dependencies
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/7rust-zip /app/bin/7rust-zip
      - install -Dm644 packaging/flatpak/io.github.rustzip.SevenRustZip.desktop
        /app/share/applications/io.github.rustzip.SevenRustZip.desktop
      - install -Dm644 assets/icon.png
        /app/share/icons/hicolor/256x256/apps/io.github.rustzip.SevenRustZip.png
      - install -Dm644 assets/icon512.png
        /app/share/icons/hicolor/512x512/apps/io.github.rustzip.SevenRustZip.png
      - install -Dm644 packaging/metainfo/io.github.rustzip.SevenRustZip.metainfo.xml
        /app/share/metainfo/io.github.rustzip.SevenRustZip.metainfo.xml
    sources:
      - type: dir
        path: ../..
        # Do not copy build output or VCS data into the sandbox
        skip:
          - target
          - dist
          - .git
          - .flatpak-builder
